name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test secrets for the Workers test runtime
        run: |
          echo "SESSION_SECRET=ci-$(openssl rand -hex 24)" > .dev.vars
          echo "DATA_KEY=$(openssl rand -base64 32)" >> .dev.vars
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Back up production D1 before migrating
        run: npx wrangler d1 export visionaryx-ops --remote --env production -c wrangler.jsonc --output pre-deploy.sql
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy.sql
          retention-days: 30
      - name: Apply migrations
        run: npx wrangler d1 migrations apply visionaryx-ops --remote --env production -c wrangler.jsonc
      - name: Build
        run: CLOUDFLARE_ENV=production npm run build
      - name: Deploy
        run: npx wrangler deploy
